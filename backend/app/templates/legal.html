{% extends "base.html" %}
{% block title %}{{ title }} · Trade Circle{% endblock %}
{% block body %}
<main class="page" style="--brand: {{ brand }}; --brand-text: {{ brand_text }};">
  <header class="site-header wood-grain">
    <span class="wordmark">Trade Circle</span>
    <nav class="site-nav">
      <a class="btn" href="/app/login">Log in</a>
      <a class="btn btn-primary" href="/app/signup">Sign up</a>
    </nav>
  </header>
  <div class="brand-stripe" aria-hidden="true"></div>

  <article class="card legal-doc">
    {{ content | safe }}
  </article>

  <p class="back"><a href="/">← Back to the front door</a></p>
</main>
{% endblock %}
